<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: dark navy rail on the left, working surface on a cool paper ground; dense operational UI, codes in mono */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EDF0F4; --line:#D7DDE5; --fg:#152033; --muted:#566275;
  --accent:#1A5DAE; --accent-fg:#FFFFFF; --accent-soft:#E2ECF8;
  --nav:#0F1D33; --nav-fg:#C4D0E2; --nav-active:#1E3A63;
  --warn:#9C4D0C; --warn-soft:#FBEDDD; --ok:#1B6E50; --ok-soft:#DFF1E8; --danger:#A83434; --danger-soft:#F8E3E3;
  --bar-1:#C5D6EC; --bar-2:#94B4DA; --bar-3:#5F8FC7; --bar-4:#3471B6;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141E; --surface:#141D2A; --surface-2:#1A2535; --line:#2A3748; --fg:#E5EBF3; --muted:#9BA8BA;
  --accent:#6EA6EE; --accent-fg:#0D141E; --accent-soft:#1B3050;
  --nav:#09101A; --nav-fg:#AAB8CC; --nav-active:#1B3050;
  --warn:#E6A366; --warn-soft:#3A2A19; --ok:#5DC698; --ok-soft:#15312A; --danger:#EE8C8C; --danger-soft:#3A1D1D;
  --bar-1:#22385A; --bar-2:#2E4E7D; --bar-3:#4371AD; --bar-4:#6EA6EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141E; --surface:#141D2A; --surface-2:#1A2535; --line:#2A3748; --fg:#E5EBF3; --muted:#9BA8BA;
  --accent:#6EA6EE; --accent-fg:#0D141E; --accent-soft:#1B3050;
  --nav:#09101A; --nav-fg:#AAB8CC; --nav-active:#1B3050;
  --warn:#E6A366; --warn-soft:#3A2A19; --ok:#5DC698; --ok-soft:#15312A; --danger:#EE8C8C; --danger-soft:#3A1D1D;
  --bar-1:#22385A; --bar-2:#2E4E7D; --bar-3:#4371AD; --bar-4:#6EA6EE; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* Rail */
.rail{background:var(--nav);color:var(--nav-fg);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3B82D6,#1A5DAE);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.brand b{color:#fff;font-size:17px}
.rail-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 4px;color:#7F90AA}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--nav-fg);text-align:left;cursor:pointer;font-size:14px}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn[aria-current="page"]{background:var(--nav-active);color:#fff;font-weight:600}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn .tag{display:none;margin-left:auto;font-size:10px;padding:1px 6px;border:1px dashed currentColor;border-radius:10px;opacity:.8}
.rail-foot{margin-top:auto;padding:12px 10px;font-size:12px;color:#8C9BB2;line-height:1.5}
/* Top bar */
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;height:40px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--muted)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.14);overflow:hidden}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;cursor:pointer}
.results button:hover{background:var(--accent-soft)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:6px 24px;border-bottom:1px solid var(--line)}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:22px;text-wrap:balance}
.crumb{font-size:13px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
/* Blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.ai{border-color:var(--accent)}
.card h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.card h2 .right{margin-left:auto}
.g{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1.25fr 1fr}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;white-space:nowrap}
.hide-codes .code{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.ghost{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.warnb{border-color:var(--warn);color:var(--warn)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.item.warnrow{background:var(--warn-soft);border-color:transparent}
.item.done{opacity:.55}
.item.done .t{text-decoration:line-through}
.item .t{flex:1;min-width:180px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font-size:14px}
label.f textarea{height:auto;padding:10px;line-height:1.55;resize:vertical}
label.f.missing{color:var(--warn);font-weight:600}
label.f.missing input{border:2px solid var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 12px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chipsel{display:flex;gap:8px;flex-wrap:wrap}
.chipsel button{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chipsel button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
/* Kanban */
.kanban-wrap{overflow-x:auto;padding-bottom:4px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;min-width:1140px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:420px;border:2px solid transparent}
.col.over{border-color:var(--accent);border-style:dashed}
.col-h{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab;font-size:13px}
.opp:hover{border-color:var(--accent)}
.opp.stale{border-color:var(--warn)}
.opp b{font-size:13.5px}
.opp .row{gap:6px}
.opp .mv{margin-left:auto}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{padding:10px 12px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:13px}
.step.done{background:var(--accent);color:var(--accent-fg);font-weight:600}
.step.cur{background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check .dot{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.check .dot.ok{background:var(--ok-soft);color:var(--ok)}
.check .dot.no{background:var(--warn-soft);color:var(--warn)}
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 64px;gap:8px 10px;align-items:center;font-size:13px}
.hbar .track{height:14px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:3px}
.cols{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 6px;border-bottom:1px solid var(--line)}
.cols i{flex:1;border-radius:4px 4px 0 0;background:var(--bar-2)}
.cols i.last{background:var(--accent)}
.tree{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px}
.tree .n{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tree .n.me{border:2px solid var(--accent);font-weight:600}
.tree .n.pot{border-style:dashed;color:var(--muted)}
.tree .lvl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.src{font-size:11px;color:var(--muted);margin-left:4px}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.funnel div{padding:12px;border-radius:8px}
.funnel .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
/* Drawer, modal, toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(10,20,40,.18);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.55;max-width:92%}
.msg.bot{background:var(--surface-2)}
.msg.me{background:var(--accent);color:var(--accent-fg);align-self:flex-end}
.drawer-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(8,14,24,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 48px rgba(0,0,0,.3)}
.modal h3{margin:0;font-size:17px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.spin{width:16px;height:16px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.letter{white-space:pre-line;font-size:13px;line-height:1.6;background:var(--surface-2);padding:12px;border-radius:8px;max-height:300px;overflow-y:auto}
/* Responsive */
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;z-index:30;gap:4px}
  .rail-h,.rail-foot,.brand span.b2{display:none}
  .brand{padding:0 8px 0 0}
  .nav-btn{width:auto;white-space:nowrap}
  .nav-btn .tag{display:none}
  .top{position:static;padding:10px 16px;flex-wrap:wrap}
  .who .nm{display:none}
  .content{padding:16px}
  .demo{padding:6px 16px}
  .g2,.g4,.g5{grid-template-columns:1fr}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stepper{grid-template-columns:1fr}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .hbar{grid-template-columns:100px minmax(0,1fr) 56px}
}
</style>

</div>

        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Năm</th><th>Doanh thu</th><th>Lợi nhuận sau thuế</th><th>Biên lợi nhuận</th></tr></thead><tbody>${c.fin.map(f=>`<tr><td>${f[0]}</td><td class="num">${f[1].toLocaleString('vi-VN')} tỷ</td><td class="num">${String(f[2]).replace('.',',')} tỷ</td><td class="num">${(100*f[2]/f[1]).toFixed(1).replace('.',',')}%</td></tr>`).join('')}</tbody></table></div>
        <div class="small muted">Nguồn: báo cáo tài chính khách hàng cung cấp, nhập một lần tại hệ thống tín dụng.</div></section>
      <section class="card"><h2>Xếp hạng và rủi ro <span class="right">${code('KH10')} ${code('CB1')}</span></h2>

        ${al.length?al.map(a=>`<div class="item ${a.lvl==='Cao'?'warnrow':''}"><span class="t"><b>${a.lvl==='Cao'?'Mức cao':'Theo dõi'}</b> · ${a.sig}<br><span class="small muted">${a.status}</span></span><button class="btn sm" data-act="go-alert" data-arg="${a.id}">Xử lý</button></div>`).join(''):'<p class="small muted" style="margin:0">Không có cảnh báo đang mở.</p>'}

function reqs(o){
  const s=o.stage;
  if(s===0) return [['Có biên bản gặp khách hàng',o.report]];
  if(s===1) return [['Có biên bản khảo sát nhu cầu',o.report],['Có giá trị dự kiến',o.val>0]];
  if(s===2) return [['Nhập tài sản bảo đảm',!!o.coll],['Giá ưu đãi đã được duyệt',o.price==='approved']];
  if(s===3) return [['Hệ thống tín dụng: đã phê duyệt',o.appr==='Đã phê duyệt']];
  return [];
}
function pipeBoard(list){
  return `<div class="kanban-wrap"><div class="kanban">${STAGES.map((s,i)=>{const cs=list.filter(o=>o.stage===i);return `<section class="col" data-drop="${i}" aria-label="${s}"><div class="col-h"><b>${i+1} · ${s}</b><span class="muted num">${cs.length} · ${fmtT(cs.reduce((a,o)=>a+o.val,0))}</span></div>
    ${cs.map(o=>`<article class="opp ${o.days>21&&i<4?'stale':''}" draggable="true" data-drag="${o.id}"><b>${short(cu(o.cid).name)}</b><span class="muted">${o.name} · <span class="num">${fmtT(o.val)}</span></span>
      <div class="row"><span class="pill neutral">${o.grp}</span>${i<2?`<span class="pill info">AI ${o.ai}</span>`:''}${o.days>21&&i<4?`<span class="pill warn">${o.days} ngày</span>`:''}${i===3?`<span class="pill neutral">${o.appr}</span>`:''}${i===4?'<span class="pill ok">Đã giải ngân</span>':''}</div>
      <div class="row"><button class="btn sm" data-act="opp" data-arg="${o.id}">Chi tiết</button>${i<4?`<button class="btn sm mv" data-act="move" data-arg="${o.id}|${i+1}" aria-label="Chuyển sang ${STAGES[i+1]}">Chuyển →</button>`:''}</div></article>`).join('')}</section>`}).join('')}</div></div>
  <p class="small muted" style="margin:0">Kéo thẻ sang cột kế tiếp hoặc bấm “Chuyển →”. Hệ thống kiểm tra điều kiện của giai đoạn trước khi cho chuyển.</p>`;
}
function pipeList(list){

}
function pipeOverview(list){
  const open=list.filter(o=>o.stage<4), won=list.filter(o=>o.stage===4);
  const reached=i=>list.filter(o=>o.stage>=i).length;
  const vals=STAGES.map((_,i)=>list.filter(o=>o.stage===i).reduce((a,o)=>a+o.val,0));
  const maxV=Math.max(...vals,1);
  const months=['T10','T11','T12','Q1/27'];
  const mv=months.map(m=>open.filter(o=>o.close===m).reduce((a,o)=>a+o.val*PROB[o.stage]/100,0));
  const maxM=Math.max(...mv,1);
  const grp=GROUPS.map(g=>{const os=open.filter(o=>o.grp===g);return [g,os.length,os.reduce((a,o)=>a+o.val,0),os.reduce((a,o)=>a+o.val*PROB[o.stage]/100,0),os.reduce((a,o)=>a+o.inc,0)]}).filter(r=>r[1]);
  const att=[];
  open.forEach(o=>{
    if(o.days>21) att.push([o,'warn',`Đứng ${o.days} ngày ở “${STAGES[o.stage]}”`]);
    if(o.price==='pending') att.push([o,'warn','Giá ưu đãi đang chờ duyệt']);
    if(o.stage===3&&o.appr!=='Đã phê duyệt') att.push([o,'info',`Hệ thống tín dụng: ${o.appr.toLowerCase()}`]);
    const miss=reqs(o).filter(r=>!r[1]); if(o.stage===2&&miss.length) att.push([o,'warn','Thiếu: '+miss.map(m=>m[0].toLowerCase()).join(', ')]);
  });
  const reasons={}; S.lost.forEach(l=>reasons[l.reason]=(reasons[l.reason]||0)+1);
  const rs=Object.entries(reasons).sort((a,b)=>b[1]-a[1]); const maxR=Math.max(...rs.map(r=>r[1]),1);
  const win=Math.round(100*(won.length+S.wonHist)/(won.length+S.wonHist+S.lost.length));
  return `<div class="g g5">
    <div class="card stat"><div class="lbl">Cơ hội đang mở</div><div class="val">${open.length}</div><div class="sub num">${fmtT(open.reduce((a,o)=>a+o.val,0))} giá trị</div></div>
    <div class="card stat"><div class="lbl">Giá trị theo xác suất</div><div class="val">${fmtT(open.reduce((a,o)=>a+o.val*PROB[o.stage]/100,0))}</div><div class="sub">Giá trị × xác suất giai đoạn</div></div>
    <div class="card stat"><div class="lbl">Dự kiến ký quý 4</div><div class="val">${fmtT(mv.slice(0,3).reduce((a,b)=>a+b,0))}</div><div class="sub">${open.filter(o=>months.slice(0,3).includes(o.close)).length} cơ hội, theo xác suất</div></div>
    <div class="card stat"><div class="lbl">Thu nhập dự kiến/năm</div><div class="val">${fmtT(open.reduce((a,o)=>a+o.inc,0))}</div><div class="sub">Lãi và phí nếu ký hết</div></div>
    <div class="card stat"><div class="lbl">Tỷ lệ thành công 90 ngày</div><div class="val">${win}%</div><div class="sub">${won.length+S.wonHist} thành công · ${S.lost.length} thất bại</div></div>
  </div>
  <div class="g g12">
    <section class="card"><h2>Phễu bán hàng <span class="right">${code('PL1')} ${code('PL8')}</span></h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Giai đoạn</th><th style="width:40%">Giá trị</th><th>Số cơ hội</th><th>Chuyển tiếp</th><th>Ngày TB</th></tr></thead><tbody>
      ${STAGES.map((s,i)=>{const cs=list.filter(o=>o.stage===i);const conv=i?Math.round(100*reached(i)/Math.max(reached(i-1),1)):100;const d=cs.length?Math.round(cs.reduce((a,o)=>a+o.days,0)/cs.length):0;
        return `<tr><td>${i+1} · ${s}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="track" style="flex:1;height:14px;border-radius:3px;background:var(--surface-2);overflow:hidden"><i style="display:block;height:100%;width:${100*vals[i]/maxV}%;background:var(--bar-${Math.min(i+1,4)})"></i></div><span class="num" style="min-width:64px">${fmtT(vals[i])}</span></div></td><td class="num">${cs.length}</td><td class="num">${i?conv+'%':'–'}</td><td class="num">${d}</td></tr>`}).join('')}
      </tbody></table></div>
      <div class="small muted">Chuyển tiếp: tỷ lệ cơ hội đi tiếp từ giai đoạn trước. Ngày TB: số ngày trung bình ở giai đoạn hiện tại.</div></section>
    <section class="card"><h2>Cần chú ý <span class="right small muted">${att.length} việc</span></h2>
      ${att.slice(0,6).map(([o,k,t])=>`<div class="item ${k==='warn'?'warnrow':''}"><span class="t"><b>${short(cu(o.cid).name)}</b> · ${o.name}<br><span class="small" style="color:var(--${k==='warn'?'warn':'muted'})">${t}</span></span><button class="btn sm" data-act="opp" data-arg="${o.id}">Mở</button></div>`).join('')||'<p class="small muted" style="margin:0">Không có cơ hội cần chú ý.</p>'}</section>
  </div>
  <div class="g g12">
    <section class="card"><h2>Theo nhóm sản phẩm <span class="right">${code('PL8')}</span></h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nhóm</th><th>Số</th><th>Giá trị</th><th>Theo xác suất</th><th>Thu nhập/năm</th></tr></thead><tbody>
      ${grp.map(r=>`<tr class="click" data-act="pgrp" data-arg="${r[0]}"><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${fmtT(r[2])}</td><td class="num">${fmtT(r[3])}</td><td class="num">${fmtT(r[4])}</td></tr>`).join('')}</tbody></table></div>
      <div class="small muted">Bấm một nhóm để lọc toàn bộ pipeline.</div></section>
    <section class="card"><h2>Dự kiến ký theo tháng <span class="right">${code('PL7')}</span></h2>
      <div class="cols" style="height:150px">${mv.map((v,i)=>`<i style="height:${Math.max(4,Math.round(100*v/maxM))}%;background:var(--bar-${i+1})" title="${months[i]}: ${fmtT(v)}"></i>`).join('')}</div>
      <div class="row small" style="justify-content:space-around">${months.map((m,i)=>`<span style="text-align:center">${m}<br><b class="num">${fmtT(mv[i])}</b></span>`).join('')}</div>
      <div class="small muted">Giá trị theo xác suất; AI hiệu chỉnh dự báo ở giai đoạn dài hạn.</div></section>
  </div>
  <div class="g g12">
  <section class="card"><h2>Cơ hội lớn nhất đang mở</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Khách hàng</th><th>Cơ hội</th><th>Giai đoạn</th><th>Giá trị</th><th>Dự kiến ký</th><th>AI điểm ${code('PL6')}</th></tr></thead><tbody>
    ${[...open].sort((a,b)=>b.val-a.val).slice(0,5).map(o=>`<tr class="click" data-act="opp" data-arg="${o.id}"><td>${short(cu(o.cid).name)}</td><td>${o.name}</td><td><span class="pill info">${o.stage+1} · ${STAGES[o.stage]}</span></td><td class="num">${fmtT(o.val)}</td><td>${o.close}</td><td class="num">${o.ai}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card"><h2>Lý do thất bại 90 ngày <span class="right">${code('PL9')}</span></h2>
      <div class="hbar" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 30px">${rs.map(([r,n])=>`<span>${r}</span><div class="track"><i style="width:${100*n/maxR}%;background:var(--bar-3)"></i></div><span class="num">${n}</span>`).join('')}</div>
      <div class="small muted">Chọn từ danh mục chuẩn khi đóng cơ hội thất bại, dùng để điều chỉnh chính sách giá và sản phẩm.</div></section>
  </div>
`;
}
function vPipeline(){
  const list=S.opps.filter(o=>(S.pipeFilter==='all'||cu(o.cid).seg===S.pipeFilter)&&(S.pgrp==='all'||o.grp===S.pgrp));
  const views=[['overview','Tổng quan'],['board','Bảng giai đoạn'],['list','Danh sách']];
  return `<div class="page-h"><h1>Sales pipeline</h1><div class="spacer"></div>
    <div class="seg" role="group" aria-label="Cách xem">${views.map(([k,l])=>`<button aria-pressed="${S.pview===k}" data-act="pview" data-arg="${k}">${l}</button>`).join('')}</div>
    <button class="btn primary" data-act="new-opp" data-arg="">+ Tạo cơ hội</button></div>

function calcPrice(){
  const p=S.price; const base=7.2-(p.term<=6?0.3:0)-(p.coll==='Tiền gửi'?0.6:p.coll==='Bất động sản'?0.2:0);
  const rate=+(base-p.disc).toFixed(2);
  const level=p.disc<=0.3?'RM':p.disc<=0.5?'Trưởng phòng':'Giám đốc chi nhánh';
  return {base:+base.toFixed(2),rate,level};

function tryMove(id,to){
  const o=op(id);
  if(to===o.stage) return;
  if(to<o.stage){o.stage=to;o.days=0;toast(`Đã chuyển về “${STAGES[to]}”`);render(true);return;}
  if(to>o.stage+1){modal=`<h3 id="mh">Chuyển từng giai đoạn</h3><p>Cơ hội cần đi qua từng giai đoạn để dữ liệu bán hàng đầy đủ. Hãy chuyển sang “${STAGES[o.stage+1]}” trước.</p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="modal-close">Đã hiểu</button></div>`;renderLayer();return;}
  const miss=reqs(o).filter(r=>!r[1]);
  if(miss.length){modal=`<h3 id="mh">Chưa đủ điều kiện sang “${STAGES[to]}”</h3><p class="muted" style="margin:0">${cu(o.cid).name} · ${o.name}</p>${miss.map(m=>`<div class="check"><span class="dot no">!</span><span>${m[0]}</span></div>`).join('')}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">Để sau</button><button class="btn primary" data-act="opp" data-arg="${o.id}">Mở cơ hội để bổ sung</button></div>`;renderLayer();return;}
  o.stage=to;o.days=0;o.ai=Math.min(99,o.ai+6);
  if(to===3&&o.appr==='Chưa trình') o.appr='Đang thẩm định';
  toast(`Đã chuyển sang “${STAGES[to]}”`);render(true);
}
function newOpp(cid,name,prod,val,stage){
  const id='o'+(Date.now()%100000);

  cu(cid).tl.unshift(['29/09','Cơ hội',`Tạo cơ hội “${name}”`]);

}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, arg=el.dataset.arg;
  if(a==='modal-close-bg'&&e.target!==el) return;
  switch(a){
    case 'go': modal=null; go(arg); break;
    case 'cust': modal=null; $('#results').hidden=true; $('#q').value=''; go('customer',arg); break;
    case 'opp': modal=null; go('opp',arg); break;
    case 'tab': S.tab=arg; render(true); break;
    case 'task-done': {const t=S.tasks.find(x=>x.id===arg);t.done=!t.done;render(true);break;}
    case 'sugg': {const s=S.sugg.find(x=>x.id===arg);newOpp(s.cid,s.title,s.prod,s.val,0);S.sugg=S.sugg.filter(x=>x!==s);toast(`Đã tạo cơ hội “${s.title}” ở giai đoạn Tiếp cận`);render(true);break;}
    case 'new-opp': {const cid=arg||'c1';modal=`<h3 id="mh">Tạo cơ hội mới</h3><label class="f" for="no-c">Khách hàng<select id="no-c">${S.customers.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="f" for="no-n">Tên cơ hội<input id="no-n" value="Tài khoản thanh toán và dịch vụ số"></label><label class="f" for="no-v">Giá trị dự kiến (tỷ đồng)<input id="no-v" type="number" value="3" min="0"></label><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">Hủy</button><button class="btn primary" data-act="new-opp-save">Tạo cơ hội</button></div>`;renderLayer();break;}
    case 'new-opp-save': {const id=newOpp($('#no-c').value,$('#no-n').value||'Cơ hội mới','Khác',+$('#no-v').value||0,0);modal=null;toast('Đã tạo cơ hội');go('opp',id);break;}
    case 'new-case': {const k={id:'YC-'+(2610+S.cases.length),cid:arg,type:'Yêu cầu mới từ RM',unit:'Phòng Dịch vụ khách hàng',left:48,sla:48,status:'Đang xử lý',log:[['Vừa xong','RM tạo yêu cầu'],['Vừa xong','Tự phân công Phòng Dịch vụ khách hàng']]};S.cases.unshift(k);S.caseSel=k.id;toast(`Đã tạo ${k.id}, tự phân công đơn vị xử lý`);go('service');break;}
    case 'pview': S.pview=arg; render(true); break;
    case 'pgrp': S.pgrp=arg; render(true); break;
    case 'pclear': S.pgrp='all'; S.pipeFilter='all'; render(true); break;

    case 'xsell': {const [cid,i]=arg.split('|');const c=cu(cid);const x=c.xsell[+i];newOpp(cid,x[0]+' cho '+short(c.name),x[0],2,0);c.xsell.splice(+i,1);toast('Đã tạo cơ hội bán chéo trong Sales pipeline');render(true);break;}
    case 'consent': {const [cid,i]=arg.split('|');cu(cid).contacts[+i][4]='Đã gửi yêu cầu';toast('Đã gửi yêu cầu đồng ý xử lý dữ liệu cá nhân');render(true);break;}
    case 'add-contact': modal=`<h3 id="mh">Thêm người liên hệ</h3><label class="f" for="nc-n">Họ tên<input id="nc-n" value="Nguyễn Văn Bình"></label><label class="f" for="nc-r">Chức vụ<input id="nc-r" value="Giám đốc tài chính"></label><label class="f" for="nc-v">Vai trò trong quyết định<select id="nc-v"><option>Người quyết định</option><option selected>Người ảnh hưởng</option><option>Người sử dụng dịch vụ</option></select></label><label class="f" for="nc-p">Điện thoại<input id="nc-p" value="090x xxx xxx"></label><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">Hủy</button><button class="btn primary" data-act="add-contact-save" data-arg="${arg}">Thêm</button></div>`; renderLayer(); break;
    case 'add-contact-save': {const c=cu(arg);c.contacts.push([$('#nc-n').value||'Người liên hệ mới',$('#nc-r').value,$('#nc-v').value,$('#nc-p').value,'Chưa có']);c.tl.unshift(['30/09','Cập nhật','Thêm người liên hệ '+($('#nc-n').value||'')]);modal=null;toast('Đã thêm người liên hệ');render(true);break;}
    case 'handover': {const c=cu(arg);modal=`<h3 id="mh">Bàn giao khách hàng</h3><p class="muted" style="margin:0">${c.name} · RM hiện tại: ${c.rm}</p><label class="f" for="ho-rm">RM nhận bàn giao<select id="ho-rm">${RMS.map(r=>`<option>${r}</option>`).join('')}</select></label><label class="f" for="ho-why">Lý do<select id="ho-why"><option>Luân chuyển công tác</option><option>Cân đối danh mục</option><option>Nghỉ dài ngày</option></select></label><label class="row small" for="ho-keep"><input type="checkbox" id="ho-keep" checked> Giữ RM hiện tại làm RM phụ trong 30 ngày để bàn giao</label><p class="small muted" style="margin:0">Cơ hội, việc đang mở và lịch sử tương tác chuyển theo khách hàng. Trưởng phòng duyệt trước khi có hiệu lực.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="modal-close">Hủy</button><button class="btn primary" data-act="handover-save" data-arg="${arg}">Gửi duyệt bàn giao</button></div>`;renderLayer();break;}
    case 'handover-save': {const c=cu(arg);const to=$('#ho-rm').value;const keep=$('#ho-keep').checked;c.tl.unshift(['30/09','Bàn giao',`${c.rm} → ${to} (${$('#ho-why').value}), chờ trưởng phòng duyệt`]);c.rm2=keep?c.rm+' (đến 30/10)':c.rm2;c.rm=to+' (chờ duyệt)';modal=null;toast('Đã gửi trưởng phòng duyệt bàn giao');render(true);break;}
    case 'add-task': {const t=$('#nt-text').value.trim();if(!t){toast('Nhập nội dung việc cần làm');break;}(S.ctasks[arg]=S.ctasks[arg]||[]).push([$('#nt-date').value||'—',t,false]);S.tasks.push({id:'t'+Date.now(),time:$('#nt-date').value,text:short(cu(arg).name)+' · '+t,code:'KH11',act:'cust',arg:arg,label:'Mở hồ sơ',done:false});toast('Đã thêm việc, hiện cả trên Trang chủ');render(true);break;}
    case 'modal-close': case 'modal-close-bg': modal=null; renderLayer(); break;
    case 'move': {const [id,to]=arg.split('|');tryMove(id,+to);break;}
    case 'sim-appr': {const o=op(arg);o.appr='Đã phê duyệt';toast('Hệ thống tín dụng: hồ sơ đã được phê duyệt');render(true);break;}
    case 'report': {const [cid,oid]=arg.split('|');S.draft={cid,oid:oid||'',type:'Khảo sát nhu cầu',who:'Giám đốc tài chính, Kế toán trưởng',text:'1. Tình hình kinh doanh: \n2. Nhu cầu tài chính: \n3. Ngân hàng đang giao dịch: \n4. Mong muốn của khách hàng: ',next:'',adv:true,ai:null};modal=null;go('report');break;}
    case 'rtype': S.draft.type=arg; render(true); break;
    case 'ai-transcribe': S.draft.ai='loading'; render(true); setTimeout(()=>{if(S.draft&&S.draft.ai==='loading'){S.draft.ai='done';if(S.route==='report')render(true);}},1300); break;
    case 'ai-fill': S.draft.text='1. Tình hình kinh doanh: đơn hàng quý 1/2027 tăng 30%, cần mở rộng xưởng số 2.\n2. Nhu cầu tài chính: hạn mức vốn lưu động 25 tỷ.\n3. Ngân hàng đang giao dịch: đang vay tại một ngân hàng khác, lãi suất khoảng 6,8%.\n4. Mong muốn của khách hàng: giải ngân trước 15/12, thủ tục gọn.';S.draft.next='Gửi đề xuất tài chính trước 05/10';S.draft.ai=null;toast('Đã điền nội dung từ AI, hãy kiểm tra lại');render(true);break;
    case 'ai-clear': S.draft.ai=null; render(true); break;
    case 'save-report': {const d=S.draft;const c=cu(d.cid);c.tl.unshift(['29/09','Biên bản',`${d.type}${d.next?' · Việc tiếp theo: '+d.next:''}`]);c.last=0;
      if(d.oid){const o=op(d.oid);if(d.adv)o.report=true;}
      const t=S.tasks.find(x=>x.act==='report'&&x.arg.startsWith(d.cid));if(t)t.done=true;
      S.draft=null;toast('Đã lưu biên bản vào hồ sơ khách hàng');go('customer',c.id);break;}
    case 'save-fields': {const c=cu(arg);let n=0;document.querySelectorAll('[data-mf]').forEach(i=>{if(i.value.trim()){c.f[i.dataset.mf]=i.value.trim();n++}});if(!n){toast('Chưa nhập trường nào');break;}c.tl.unshift(['29/09','Cập nhật',`Bổ sung ${n} trường thông tin`]);toast(`Đã lưu. Điểm dữ liệu mới: ${score(c)}/100`);render(true);break;}
    case 'remind': {S.mature[+arg].state='Đã tạo nhắc việc';toast('Đã thêm vào Việc cần làm');render(true);break;}
    case 'refi': {const m=S.mature[+arg];newOpp(m.cid,'Tái cấp khoản vay vốn lưu động','Vay vốn lưu động',18.5,0);m.state='Đã tạo cơ hội';toast('Đã tạo cơ hội tái cấp');render(true);break;}
    case 'scope': S.scope=arg; render(true); break;
    case 'camp': S.campSel=arg; render(true); break;
    case 'camp-ai': {const k=S.camps.find(x=>x.id===S.campSel);toast(`AI đề xuất ${k.ai} khách hàng; Hội sở duyệt trước khi giao`);break;}
    case 'camp-opp': {const k=S.camps.find(x=>x.id===S.campSel);const x=k.list[+arg];newOpp(x.cid,k.name.split(' ').slice(0,3).join(' '),'Theo chiến dịch',1.5,0);x.res='Thành cơ hội';toast('Đã chuyển thành cơ hội trong Sales pipeline');render(true);break;}
    case 'pricing': S.price.oid=arg; if(op(arg).price==='approved')S.price.status='approved'; else if(op(arg).price==='pending')S.price.status='pending'; else S.price.status='draft'; go('pricing'); break;
    case 'price-send': {const r=calcPrice();const o=op(S.price.oid);if(r.level==='RM'){o.price='approved';o.rate=r.rate;S.price.status='approved';toast('Đã áp dụng giá trong thẩm quyền');}else{o.price='pending';S.price.status='pending';S.price.level=r.level;toast(`Đã gửi ${r.level} duyệt`);}render(true);break;}
    case 'price-approve': {const r=calcPrice();const o=op(S.price.oid);o.price='approved';o.rate=r.rate;S.price.status='approved';toast(`${S.price.level} đã duyệt giá`);render(true);break;}
    case 'letter': {const o=op(S.price.oid),c=cu(o.cid),r=calcPrice();modal=`<h3 id="mh">Thư chào tín dụng (AI soạn nháp)</h3><div class="letter">Kính gửi: Ban Giám đốc ${c.name}

Ngân hàng trân trọng cảm ơn Quý Công ty đã tin tưởng hợp tác. Căn cứ nhu cầu đã trao đổi, chúng tôi đề xuất:

• Sản phẩm: ${o.prod}
• Hạn mức: ${S.price.amt} tỷ đồng, kỳ hạn ${S.price.term} tháng
• Lãi suất: ${String(r.rate).replace('.',',')}%/năm (ưu đãi theo mức đóng góp của Quý Công ty)
• Tài sản bảo đảm: ${S.price.coll}

Kèm theo: gói tài khoản thanh toán và dịch vụ chi lương miễn phí 12 tháng.

Trân trọng,
Nguyễn Thu Hà · Chuyên viên quan hệ khách hàng</div><p class="small muted" style="margin:0">Bản nháp do AI soạn từ dữ liệu cơ hội; RM chỉnh sửa trước khi gửi.</p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="modal-close">Đóng</button></div>`;renderLayer();break;}
    case 'case': S.caseSel=arg; go('service'); break;
    case 'case-sel': S.caseSel=arg; render(true); break;
    case 'case-remind': toast('Đã nhắc đơn vị xử lý qua hệ thống'); break;
    case 'case-close': {const k=S.cases.find(x=>x.id===S.caseSel);k.status='Đã xử lý';k.log.push(['Vừa xong','Đóng yêu cầu, gửi khảo sát hài lòng']);const t=S.tasks.find(x=>x.code==='DV2');if(t&&k.cid==='c4')t.done=true;toast('Đã đóng yêu cầu và gửi khảo sát cho khách hàng');render(true);break;}
    case 'alert-sel': S.alertSel=arg; render(true); break;
    case 'alert-save': {const a=S.alerts.find(x=>x.id===S.alertSel);a.note=$('#a-note').value;if(a.status==='Mới')a.status='RM đang xử lý';const t=S.tasks.find(x=>x.code==='CB1');if(t&&a.cid==='c3')t.done=true;toast('Đã lưu biện pháp');render(true);break;}
    case 'alert-risk': {const a=S.alerts.find(x=>x.id===S.alertSel);a.note=$('#a-note').value;a.status='Đã chuyển quản lý rủi ro';toast('Đã chuyển sang Quản lý rủi ro kèm biện pháp của RM');render(true);break;}
    case 'dup-sel': S.dupSel=arg; render(true); break;
    case 'dup-merge': case 'dup-no': {S.dups=S.dups.filter(x=>x.id!==S.dupSel);S.dupDone++;S.dupSel=S.dups[0]?.id;toast(a==='dup-merge'?'Đã hợp nhất, lưu vết, có thể hoàn tác':'Đã đánh dấu không trùng');render(true);break;}
    case 'ai-open': S.aiOpen=true; renderLayer(); setTimeout(()=>$('#askq')?.focus(),30); break;
    case 'ai-close': S.aiOpen=false; renderLayer(); break;
    case 'ask': S.chat.push(['me',esc(arg)],['bot',QA[arg]]); renderLayer(); break;
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='askf'){e.preventDefault();const q=$('#askq').value.trim();if(!q)return;S.chat.push(['me',esc(q)],['bot','Bản mô phỏng trả lời các câu hỏi gợi ý. Khi triển khai, trợ lý tra cứu kho tài liệu nội bộ và dữ liệu CRM theo quyền của RM.']);renderLayer();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='codes'){document.body.classList.toggle('hide-codes',!t.checked);return;}
  if(t.dataset.bind){S[t.dataset.bind]=t.value;render(true);}
  if(t.dataset.cf){S.cf[t.dataset.cf]=t.value;render(true);}
  if(t.dataset.ctask){const [cid,i]=t.dataset.ctask.split('|');S.ctasks[cid][+i][2]=t.checked;render(true);}
  if(t.dataset.dbind){const k=t.dataset.dbind;S.draft[k]=t.type==='checkbox'?t.checked:t.value;if(k==='cid'){S.draft.oid='';render(true);}}
  if(t.dataset.ofield){const o=op(S.param);o[t.dataset.ofield]=t.dataset.ofield==='val'?+t.value:t.value.trim();render(true);}
  if(t.dataset.pbind){const k=t.dataset.pbind;S.price[k]=['amt','term','disc'].includes(k)?+t.value:t.value;if(k!=='reason'&&S.price.status!=='approved')S.price.status='draft';render(true);}
  if(t.dataset.campres){const k=S.camps.find(x=>x.id===S.campSel);k.list[+t.dataset.campres].res=t.value;render(true);}
  if(t.dataset.dp){const [i,j]=t.dataset.dp.split('|');S.dupPick[S.dupSel+i]=+j;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.dbind==='text'||t.dataset.dbind==='next'||t.dataset.dbind==='who'){S.draft[t.dataset.dbind]=t.value;}
  if(t.dataset.cfq!==undefined){S.cf.q=t.value;render(true);const n=$('#cf-q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}return;}
  if(t.id==='q'){const q=t.value.trim().toLowerCase();const r=$('#results');if(!q){r.hidden=true;return;}
    const m=S.customers.filter(c=>(c.name+c.cif+c.mst).toLowerCase().includes(q)).slice(0,6);
    r.innerHTML=m.length?m.map(c=>`<button data-act="cust" data-arg="${c.id}"><b>${c.name}</b><div class="small muted">CIF ${c.cif} · MST ${c.mst}</div></button>`).join(''):'<div class="small muted" style="padding:10px 12px">Không tìm thấy khách hàng</div>';r.hidden=false;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal){modal=null;renderLayer();}else if(S.aiOpen){S.aiOpen=false;renderLayer();}$('#results').hidden=true;}});
/* Drag and drop on the pipeline board */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(c){dragId=c.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}}});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-drop]');if(col&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over');}});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over');});
document.addEventListener('drop',e=>{const col=e.target.closest?.('[data-drop]');if(col&&dragId){e.preventDefault();col.classList.remove('over');const id=dragId;dragId=null;tryMove(id,+col.dataset.drop);}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));});

let start='home';
try{const r=localStorage.getItem('crm1-route');if(r&&VIEWS[r]&&!['customer','opp','report'].includes(r))start=r;}catch(e){}
const h=(location.hash||'').slice(1); if(VIEWS[h]&&!['customer','opp','report'].includes(h)) start=h;
go(start);
})();
</script>
